<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard | Dairy System</title>
    <link rel="stylesheet" href="../css/output.css" />
</head>

<body>
    <aside id="sidebar"></aside>

    <div class="flex min-h-screen flex-col lg:ml-64">
        <header id="topbar"></header>

        <main class="flex-1 p-6">
            <h2 class="mb-6 text-2xl font-semibold text-slate-800">Dashboard</h2>

            <div class="mb-8 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
                <div class="card">
                    <p class="text-sm text-slate-500">Today's milk</p>
                    <p id="sMilk" class="mt-1 text-2xl font-bold text-brand-700">-</p>
                    <p id="sEntries" class="mt-1 text-xs text-slate-500"></p>
                </div>
                <div class="card">
                    <p class="text-sm text-slate-500">Today's amount</p>
                    <p id="sAmount" class="mt-1 text-2xl font-bold text-brand-700">-</p>
                    <p class="mt-1 text-xs text-slate-500">Rate x liters</p>
                </div>
                <div class="card">
                    <p class="text-sm text-slate-500">Active farmers</p>
                    <p id="sFarmers" class="mt-1 text-2xl font-bold text-brand-700">-</p>
                    <p id="sFarmersSub" class="mt-1 text-xs text-slate-500"></p>
                </div>
                <div class="card">
                    <p class="text-sm text-slate-500">Payable this fortnight</p>
                    <p id="sPayable" class="mt-1 text-2xl font-bold text-brand-700">-</p>
                    <p id="sPeriod" class="mt-1 text-xs text-slate-500"></p>
                </div>
            </div>

            <div class="mb-8 grid gap-6 lg:grid-cols-3">
                <div class="card lg:col-span-2">
                    <h3 class="mb-4 font-semibold text-slate-800">Milk collected, last 7 days (liters)</h3>
                    <div class="relative h-64"><canvas id="trend"></canvas></div>
                    <p id="chartMsg" class="mt-3 hidden text-sm text-slate-500"></p>
                </div>

                <div class="card">
                    <h3 class="mb-4 font-semibold text-slate-800">Quick actions</h3>
                    <div class="flex flex-col gap-3">
                        <a href="milk-collection.html" class="btn-primary">Add milk entry</a>
                        <a href="farmers.html" class="btn-secondary">Manage farmers</a>
                        <a href="payments.html" class="btn-secondary">View payments</a>
                        <a href="rate-chart.html" class="btn-secondary">Edit rate chart</a>
                    </div>
                </div>
            </div>

            <h3 class="mb-3 text-lg font-semibold text-slate-800">Recent entries</h3>
            <div class="table-wrap">
                <table class="table-base">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Farmer</th>
                            <th>Shift</th>
                            <th>Type</th>
                            <th>Liters</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="recent"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/chart.umd.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/store.js"></script>
    <script>
        requireRole("admin");
        renderLayout("admin", "dashboard");

        const el = (id) => document.getElementById(id);
        const today = todayISO();
        const farmers = Farmers.all();
        const names = {};
        farmers.forEach((f) => { names[f.code] = f.name; });
        const all = Collections.all();

        /* Stat cards */
        const todays = all.filter((e) => e.date === today);
        const liters = todays.reduce((s, e) => s + e.qty, 0);
        const money = todays.reduce((s, e) => s + e.amount, 0);
        el("sMilk").textContent = liters.toFixed(1) + " L";
        el("sEntries").textContent = todays.length + (todays.length === 1 ? " entry" : " entries") + " today";
        el("sAmount").textContent = formatNPR(money);

        const active = farmers.filter((f) => f.status === "active").length;
        el("sFarmers").textContent = active;
        el("sFarmersSub").textContent = "of " + farmers.length + " registered";

        const mode = Number(today.slice(8, 10)) <= 15 ? "first" : "second";
        const range = Payments.range(today.slice(0, 7), mode);
        const payable = Payments.summarize(range.from, range.to).reduce((s, r) => s + r.amount, 0);
        el("sPayable").textContent = formatNPR(payable);
        el("sPeriod").textContent = formatDate(range.from) + " to " + formatDate(range.to);

        /* Last 7 days chart */
        const labels = [];
        const data = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date();
            d.setDate(d.getDate() - i);
            const iso = isoLocal(d);
            labels.push(d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }));
            const total = all.filter((e) => e.date === iso).reduce((s, e) => s + e.qty, 0);
            data.push(Math.round(total * 10) / 10);
        }

        const msg = el("chartMsg");
        if (typeof Chart === "undefined") {
            msg.textContent = "Chart library not found. Check that js/chart.umd.js exists.";
            msg.classList.remove("hidden");
        } else {
            new Chart(el("trend"), {
                type: "bar",
                data: { labels: labels, datasets: [{ label: "Liters", data: data, backgroundColor: "#16a34a", borderRadius: 6 }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } },
                },
            });
            if (data.every((v) => v === 0)) {
                msg.textContent = "No milk recorded in the last 7 days. Add entries on the Milk Collection page.";
                msg.classList.remove("hidden");
            }
        }

        /* Recent entries */
        const recent = all.slice().sort((a, b) => b.id - a.id).slice(0, 5);
        el("recent").innerHTML = recent.length === 0
            ? '<tr><td colspan="6" class="py-8 text-center text-slate-500">No entries yet.</td></tr>'
            : recent.map((e) => `
        <tr>
          <td>${formatDate(e.date)}</td>
          <td>${esc(names[e.farmer] || e.farmer)}</td>
          <td class="capitalize">${esc(e.shift)}</td>
          <td class="capitalize">${esc(e.type)}</td>
          <td>${e.qty.toFixed(1)}</td>
          <td class="font-medium">${formatNPR(e.amount)}</td>
        </tr>`).join("");
    </script>
</body>

</html>
