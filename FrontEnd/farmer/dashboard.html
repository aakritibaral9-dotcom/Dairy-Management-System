<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Dashboard | Dairy System</title>
    <link rel="stylesheet" href="../css/output.css" />
</head>

<body>
    <aside id="sidebar"></aside>

    <div class="flex min-h-screen flex-col lg:ml-64">
        <header id="topbar"></header>

        <main class="flex-1 p-6">
            <h2 class="text-2xl font-semibold text-slate-800">My Dashboard</h2>
            <p id="welcome" class="mb-6 text-sm text-slate-500"></p>

            <div class="mb-8 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
                <div class="card">
                    <p class="text-sm text-slate-500">Today's milk</p>
                    <p id="sToday" class="mt-1 text-2xl font-bold text-brand-700">-</p>
                    <p id="sTodayAmt" class="mt-1 text-xs text-slate-500"></p>
                </div>
                <div class="card">
                    <p class="text-sm text-slate-500">This month's milk</p>
                    <p id="sMonth" class="mt-1 text-2xl font-bold text-brand-700">-</p>
                    <p id="sMonthAmt" class="mt-1 text-xs text-slate-500"></p>
                </div>
                <div class="card">
                    <p class="text-sm text-slate-500">Payable this fortnight</p>
                    <p id="sFortnight" class="mt-1 text-2xl font-bold text-brand-700">-</p>
                    <p id="sPeriod" class="mt-1 text-xs text-slate-500"></p>
                </div>
                <div class="card">
                    <p class="text-sm text-slate-500">Average quality (month)</p>
                    <p id="sFat" class="mt-1 text-2xl font-bold text-brand-700">-</p>
                    <p id="sSnf" class="mt-1 text-xs text-slate-500"></p>
                </div>
            </div>

            <div class="card mb-8">
                <h3 class="mb-4 font-semibold text-slate-800">My milk, last 7 days (liters)</h3>
                <div class="relative h-64"><canvas id="trend"></canvas></div>
                <p id="chartMsg" class="mt-3 hidden text-sm text-slate-500"></p>
            </div>

            <div class="mb-3 flex items-center justify-between">
                <h3 class="text-lg font-semibold text-slate-800">Recent entries</h3>
                <a href="my-collections.html" class="text-sm font-medium text-brand-700 hover:underline">View all</a>
            </div>
            <div class="table-wrap">
                <table class="table-base">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Shift</th>
                            <th>Type</th>
                            <th>Liters</th>
                            <th>Fat</th>
                            <th>SNF</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="recent"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/chart.umd.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/store.js"></script>
    <script>
        function init(user) {
            renderLayout("farmer", "dashboard");
            const el = (id) => document.getElementById(id);
            const sum = (list, fn) => list.reduce((s, e) => s + fn(e), 0);

            const today = todayISO();
            const mine = Collections.all().filter((e) => e.farmer === user.code);
            el("welcome").textContent = "Welcome, " + user.name + " (" + user.code + ")";

            const todays = mine.filter((e) => e.date === today);
            el("sToday").textContent = sum(todays, (e) => e.qty).toFixed(1) + " L";
            el("sTodayAmt").textContent = formatNPR(sum(todays, (e) => e.amount));

            const month = today.slice(0, 7);
            const monthList = mine.filter((e) => e.date.slice(0, 7) === month);
            const mLit = sum(monthList, (e) => e.qty);
            el("sMonth").textContent = mLit.toFixed(1) + " L";
            el("sMonthAmt").textContent = formatNPR(sum(monthList, (e) => e.amount));
            el("sFat").textContent = mLit ? "Fat " + (sum(monthList, (e) => e.fat * e.qty) / mLit).toFixed(2) : "-";
            el("sSnf").textContent = mLit ? "SNF " + (sum(monthList, (e) => e.snf * e.qty) / mLit).toFixed(2) : "No entries this month";

            const mode = Number(today.slice(8, 10)) <= 15 ? "first" : "second";
            const range = Payments.range(month, mode);
            const row = Payments.summarize(range.from, range.to).find((r) => r.farmer === user.code);
            el("sFortnight").textContent = formatNPR(row ? row.amount : 0);
            el("sPeriod").textContent = formatDate(range.from) + " to " + formatDate(range.to);

            const labels = [];
            const data = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const iso = isoLocal(d);
                labels.push(d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }));
                data.push(Math.round(sum(mine.filter((e) => e.date === iso), (e) => e.qty) * 10) / 10);
            }

            const msg = el("chartMsg");
            if (typeof Chart === "undefined") {
                msg.textContent = "Chart library not found. Check that js/chart.umd.js exists.";
                msg.classList.remove("hidden");
            } else {
                new Chart(el("trend"), {
                    type: "bar",
                    data: { labels: labels, datasets: [{ label: "Liters", data: data, backgroundColor: "#16a34a", borderRadius: 6 }] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } },
                    },
                });
                if (data.every((v) => v === 0)) {
                    msg.textContent = "No milk recorded for you in the last 7 days.";
                    msg.classList.remove("hidden");
                }
            }

            const recent = mine.slice().sort((a, b) => (a.date === b.date ? b.id - a.id : b.date.localeCompare(a.date))).slice(0, 5);
            el("recent").innerHTML = recent.length === 0
                ? '<tr><td colspan="7" class="py-8 text-center text-slate-500">No entries yet.</td></tr>'
                : recent.map((e) => `
          <tr>
            <td>${formatDate(e.date)}</td>
            <td class="capitalize">${esc(e.shift)}</td>
            <td class="capitalize">${esc(e.type)}</td>
            <td>${e.qty.toFixed(1)}</td>
            <td>${e.fat.toFixed(1)}</td>
            <td>${e.snf.toFixed(1)}</td>
            <td class="font-medium">${formatNPR(e.amount)}</td>
          </tr>`).join("");
        }

        const user = requireRole("farmer");
        if (user && !user.code) {
            Session.clear();
            window.location.href = "../index.html";
        } else if (user) {
            init(user);
        }
    </script>
</body>

</html>
