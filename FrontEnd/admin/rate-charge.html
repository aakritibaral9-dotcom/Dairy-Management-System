<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rate Chart | Dairy System</title>
    <link rel="stylesheet" href="../css/output.css" />
</head>

<body>
    <aside id="sidebar"></aside>

    <div class="flex min-h-screen flex-col lg:ml-64">
        <header id="topbar"></header>

        <main class="flex-1 p-6">
            <div class="mb-2 flex flex-wrap items-center justify-between gap-3">
                <h2 class="text-2xl font-semibold text-slate-800">Rate Chart</h2>
                <div class="flex gap-3">
                    <button id="resetBtn" class="btn-secondary">Reset demo values</button>
                    <button id="saveBtn" class="btn-primary">Save chart</button>
                </div>
            </div>
            <p class="mb-6 text-sm text-slate-500">Rate per liter (Rs.) for each Fat % and SNF % combination. Edit a
                cell, then click Save.</p>

            <div class="table-wrap mb-8">
                <table class="table-base" id="chart"></table>
            </div>

            <div class="card max-w-md">
                <h3 class="mb-3 font-semibold text-slate-800">Test rate lookup</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="tFat" class="form-label">Fat %</label>
                        <input id="tFat" type="number" step="0.1" class="form-input border" placeholder="e.g. 4.2" />
                    </div>
                    <div>
                        <label for="tSnf" class="form-label">SNF %</label>
                        <input id="tSnf" type="number" step="0.1" class="form-input border" placeholder="e.g. 8.6" />
                    </div>
                </div>
                <button id="testBtn" class="btn-primary mt-4">Find rate</button>
                <p id="testResult" class="mt-3 text-sm font-medium text-slate-700"></p>
            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/store.js"></script>
    <script>
        requireRole("admin");
        renderLayout("admin", "rates");

        const chart = document.getElementById("chart");

        function build() {
            const map = RateChart.all();
            let html = "<thead><tr><th>Fat % \\ SNF %</th>" +
                RATE_SNFS.map((s) => "<th>" + s.toFixed(1) + "</th>").join("") + "</tr></thead><tbody>";
            RATE_FATS.forEach((f) => {
                html += "<tr><td class='font-semibold'>" + f.toFixed(1) + "</td>";
                RATE_SNFS.forEach((s) => {
                    const k = RateChart.keyOf(f, s);
                    html += "<td><input type='number' min='0' step='0.5' data-key='" + k + "' value='" + map[k] +
                        "' class='form-input w-24 border' /></td>";
                });
                html += "</tr>";
            });
            chart.innerHTML = html + "</tbody>";
        }

        document.getElementById("saveBtn").addEventListener("click", () => {
            const map = {};
            let ok = true;
            chart.querySelectorAll("input[data-key]").forEach((inp) => {
                const v = parseFloat(inp.value);
                if (isNaN(v) || v <= 0) { ok = false; inp.classList.add("border-red-500"); }
                else { inp.classList.remove("border-red-500"); map[inp.dataset.key] = v; }
            });
            if (!ok) { showToast("Every cell needs a rate greater than 0.", "error"); return; }
            RateChart.save(map);
            showToast("Rate chart saved.", "success");
        });

        document.getElementById("resetBtn").addEventListener("click", () => {
            RateChart.reset();
            build();
            showToast("Demo values restored.", "info");
        });

        document.getElementById("testBtn").addEventListener("click", () => {
            const fat = parseFloat(document.getElementById("tFat").value);
            const snf = parseFloat(document.getElementById("tSnf").value);
            const out = document.getElementById("testResult");
            if (isNaN(fat) || isNaN(snf)) { out.textContent = "Enter both Fat % and SNF %."; return; }
            const rate = RateChart.lookup(fat, snf);
            out.textContent = rate === null
                ? "Outside the chart range (minimum Fat 3.0, SNF 7.5)."
                : "Rate: " + formatNPR(rate) + " per liter";
        });

        build();
    </script>
</body>

</html>
